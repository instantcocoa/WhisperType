name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM + model
        uses: actions/cache@v4
        with:
          path: |
            .build
            build/model-cache
          key: ${{ runner.os }}-${{ hashFiles('Package.resolved', 'scripts/fetch-model.sh') }}

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Optional: Developer ID signing. Set repo secrets MACOS_CERT_P12 (base64
      # .p12), MACOS_CERT_PASSWORD and SIGN_IDENTITY to enable; otherwise the
      # build is ad-hoc signed.
      - name: Import signing certificate
        id: cert
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then echo "No signing secrets — ad-hoc signing."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          echo "sign=1" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          WHISPERTYPE_VERSION: ${{ steps.ver.outputs.version }}
          WHISPERTYPE_BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign == '1' && secrets.SIGN_IDENTITY || '' }}
        run: ./scripts/build-app.sh release

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign == '1' && secrets.SIGN_IDENTITY || '' }}
        run: ./scripts/make-dmg.sh build/WhisperType.app "build/WhisperType-${{ steps.ver.outputs.version }}.dmg"

      # Optional notarization (needs APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD).
      - name: Notarize
        if: steps.cert.outputs.sign == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then echo "No notarization secrets — skipping."; exit 0; fi
          DMG="build/WhisperType-${{ steps.ver.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Verify bundle
        run: codesign --verify --deep --strict build/WhisperType.app

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperType-dmg
          path: build/WhisperType-*.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/WhisperType-*.dmg \
            --title "WhisperType ${{ steps.ver.outputs.version }}" --generate-notes
